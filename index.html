<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Verification</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="https://kit.fontawesome.com/6c1f7b3e8f.js" crossorigin="anonymous"></script>
</head>

<body>

<header class="header">

    <div class="announcement">
        قواعد الإفصاح عن أسعار المنتجات التمويلية للأفراد
    </div>

    <div class="navbar">

        <div class="nav-right">
            <button class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <div class="nav-center">
            <img src="images/logo.png" alt="Logo">
        </div>

        <div class="nav-left">

            <button>
                <i class="fa-regular fa-user"></i>
            </button>

            <button>
                🌐
            </button>

            <button>
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

        </div>

    </div>

</header>

<section class="verification-card">

    <form>

        <div class="input-group">

            <label>
                رقم الهوية الوطنية أو الإقامة أو رقم المنشأة
            </label>

            <input
                type="text"
                placeholder="يرجى إدخال رقم الهوية الوطنية أو الإقامة أو رقم المنشأة">

        </div>

        <div class="input-group">

            <label>
                الرقم التسلسلي
            </label>

            <input
                type="text"
                placeholder="يرجى إدخال الرقم التسلسلي">

        </div>

        <button type="submit">
            انقر هنا لتحميل الملف
        </button>

    </form>

</section>

<script src="script.js"></script>

</body>

</html>
